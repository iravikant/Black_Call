  <g transform="translate(150 180)">
    <path d="M0-110 L88-76 V-4 C88 50 50 92 0 112 C-50 92 -88 50 -88-4 V-76 Z"
          fill="none" stroke="url(#brand)" stroke-width="10" stroke-linejoin="round"/>
    <path transform="translate(-54 -54) scale(4.5)" fill="url(#brand)" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
    <line x1="-62" y1="-62" x2="62" y2="62" stroke="#FF6B6B" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
  </g>

  <text x="290" y="168" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Black Call</text>
  <text x="294" y="222" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="url(#brand)">Stop unwanted calls before the phone even rings.</text>
  <text x="294" y="272" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#9CA3AF">On-device  •  No internet permission  •  Jetpack Compose  •  Android 10+</text>
</svg>
