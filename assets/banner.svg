<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Black Call: on-device call blocker for Android">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="#050B0C"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#14B8A6" stroke-opacity="0.35"/>

