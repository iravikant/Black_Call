name: Release

# Push a tag like v1.2.0 (or v1.2.0-beta.1 for a pre-release) and this workflow builds a signed
# APK + AAB, writes checksums, and publishes a GitHub Release with auto-generated notes.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write        # create the release
  id-token: write        # build provenance attestation
  attestations: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          BASE="${NAME%%-*}"                       # 1.2.3 (strip -beta.1 etc.)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          PRE=false; [[ "$NAME" == *-* ]] && PRE=true
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "name=$NAME"     >> "$GITHUB_OUTPUT"
          echo "code=$CODE"     >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (code $CODE), prerelease=$PRE"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See README > Releasing."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          N="Black-Call-${{ steps.ver.outputs.tag }}"
          cp app/build/outputs/apk/release/app-release.apk        "dist/$N.apk"
          cp app/build/outputs/bundle/release/app-release.aab     "dist/$N.aab"
          cp app/build/outputs/mapping/release/mapping.txt        "dist/$N-mapping.txt" || true
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "dist/Black-Call-${{ steps.ver.outputs.tag }}.apk"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Black Call ${{ steps.ver.outputs.tag }}
          tag_name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/*-mapping.txt
            dist/SHA256SUMS.txt
          body: |
            ## 📲 Install
            1. Download **`Black-Call-${{ steps.ver.outputs.tag }}.apk`** below.
            2. Open it on your phone and allow *Install unknown apps* if asked.
            3. Launch Black Call and grant the **Call screening** role.

            Requires **Android 10+**. Verify the download with `SHA256SUMS.txt`.

      - name: Upload build outputs (backup)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.tag }}
          path: dist/
          retention-days: 30
